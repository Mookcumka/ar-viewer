uto;top:54px}body.xr #panel,body.object #panel{position:fixed;left:0;right:0;bottom:max(20px,calc(env(safe-area-inset-bottom) + 12px));max-width:none;align-self:auto;padding:0 max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left))}body.xr #xr-controls{flex-direction:column;gap:10px}#xr-scale{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}#xr-scale button{min-height:36px;padding:7px 12px;font-size:12px}#xr-scale button[aria-pressed=true]{background:var(--ink);color:#151718}
