<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AR Viewer · Exporto</title><meta name="theme-color" content="#111416"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><link rel="apple-touch-icon" href="./icon.svg">
<style>
:root{color-scheme:dark;--ink:#f4f3ef;--muted:#b3b8b8;--glass:rgba(20,24,25,.66);--line:rgba(255,255,255,.16)}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#111416;color:var(--ink);font:14px/1.4 -apple-system,system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}button,a,input{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #7fc4c8;outline-offset:4px}[hidden]{display:none!important}
#camera-preview{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;transform:none;background:#111416;z-index:0}body:not(.hiro) #arjs-video,body:not(.hiro) a-scene{display:none!important}#camera-info,#tracking-info{white-space:pre-wrap;overflow-wrap:anywhere;font-size:10px}
#ui{position:fixed;inset:0;z-index:1000;pointer-events:none;padding:max(12px,env(safe-area-inset-top)) 14px max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;justify-content:space-between}
header{align-self:stretch;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}#chip{padding:5px 9px;border-radius:10px;background:rgba(16,22,23,.55);font-size:12px;min-width:0;text-shadow:0 1px 6px #000}#chip b{font-weight:600;display:block;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;max-width:70vw}#chip small{display:block;font-size:10px;color:var(--muted)}#chip #sheet,#dot{display:none}button,.glass,#look{pointer-events:auto}button,#look{border:1px solid var(--line);border-radius:24px;background:var(--glass);color:var(--ink);min-height:44px;padding:10px 17px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}.primary{background:var(--ink);color:#151718;font-weight:600}.icon{width:44px;padding:10px;display:inline-flex;align-items:center;justify-content:center}.icon svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}button:disabled{opacity:.4}
#part-progress{position:absolute;top:max(72px,calc(env(safe-area-inset-top) + 64px));display:flex;gap:7px;pointer-events:none}.part{width:29px;height:29px;display:flex;align-items:center;justify-content:center;border:1px solid #a8b2b5;border-radius:9px;background:rgba(20,24,25,.48);color:#e1e6e7;font-size:13px;font-variant-numeric:tabular-nums;transition:background .15s,color .15s}.part[data-received=true]{background:#88dbab;border-color:#88dbab;color:#10291c}
#panel{align-self:center;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:min(100%,440px);pointer-events:none}#status{margin:0;text-align:center;font-size:13px;max-width:330px;text-shadow:0 1px 6px #000}body.live #status:not([data-error=true]){display:none}.actions{display:flex;gap:9px;align-items:center;justify-content:center;flex-wrap:wrap}#look{display:inline-flex;gap:8px;align-items:center;text-decoration:none;background:var(--ink);color:#151718;font-weight:600}#look img{width:22px;height:22px}#look::after{content:'Открыть AR'}#offline{font-size:10px;color:var(--muted);text-align:center;max-width:330px}body.live #offline,body.xr #offline,body.object #offline{display:none}
#scan-outline{position:fixed;inset:0;width:100%;height:100%;z-index:999;pointer-events:none}#scan-outline polygon{fill:none;stroke:#e1e8ec;stroke-width:2;stroke-linejoin:round;filter:drop-shadow(0 0 1px #111)}#scan-outline polygon[data-kind=decoded]{stroke:#87c9ed}#scan-outline polygon[data-kind=accepted]{stroke:#88dbab}#scan-outline polygon[data-kind=other],#scan-outline polygon[data-kind=rejected]{stroke:#e7bd75}#reticle{position:absolute;top:50%;left:50%;width:min(62vw,280px);aspect-ratio:1;transform:translate(-50%,-50%);opacity:.5;pointer-events:none}#reticle i{position:absolute;width:24px;height:24px;border:2px solid white}#reticle i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0}#reticle i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0}#reticle i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0}#reticle i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0}
#webxr-canvas,#object-canvas{position:fixed;inset:0;z-index:10}#mode-switch{display:flex;gap:2px;border-radius:24px;padding:3px;background:var(--glass);pointer-events:auto}#mode-switch button{min-height:36px;border:0;padding:7px 15px;background:none;backdrop-filter:none}#mode-switch button[aria-pressed=true]{background:var(--ink);color:#151718}#xr-controls{display:flex;gap:9px;align-items:center;pointer-events:auto}#xr-controls label{display:flex;align-items:center;gap:7px;font-size:11px}#xr-size{width:80px}#xr-reset{padding:8px 12px;min-height:36px;font-size:12px}body.xr #part-progress,body.object #part-progress{display:none}body.xr #look,body.object #look,body.xr #webxr-open,body.object #webxr-open{display:none!important}:xr-overlay{background:transparent}
#share-wrap{position:relative}#share-menu{position:absolute;right:0;bottom:54px;display:flex;flex-direction:column;gap:4px;padding:7px;border-radius:16px;background:#202628;box-shadow:0 6px 24px #0005;pointer-events:auto}#share-menu button{white-space:nowrap;min-width:130px;border:0;background:none;text-align:left}#diagnostics{font-size:11px;max-height:32vh;overflow:auto;pointer-events:auto;background:var(--glass);border-radius:12px;padding:8px}#diagnostics button{font-size:11px;min-height:32px;padding:6px 10px}.a-enter-vr,.a-enter-ar,.a-orientation-modal{display:none!important}
@media(orientation:landscape) and (max-height:500px){#panel{align-self:flex-end;max-width:46vw}#part-progress{top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%)}#status{max-width:280px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script defer src="./version.js"></script><script defer src="./webxr.js"></script><script defer src="./object-view.js"></script><script defer src="./model-files.js"></script><script defer src="./ar-data.js"></script><script defer src="./vendor/meshopt_decoder.js"></script><script defer src="./vendor/gbx-earcut.js"></script><script defer src="./gbx-geometry.js"></script><script defer src="./gbx2-library.js"></script><script defer src="./gbx2-geometry.js"></script><script defer src="./qr-geometry.js"></script><script defer src="./usdz.js"></script><script defer src="./vendor/jsQR.js"></script><script defer src="./vendor/aframe.min.js"></script><script defer src="./vendor/aframe-ar.js"></script><script defer src="./offline.js"></script><script defer src="./scan-feedback.js"></script><script defer src="./camera.js"></script><script defer src="./qr-tracker.js"></script><script defer src="./qr-overlay.js"></script><script defer src="./viewer.js"></script>
</head><body><video id="camera-preview" autoplay muted playsinline aria-label="Камера QR" hidden></video><svg id="scan-outline" aria-hidden="true"></svg><div id="ui">
<header><div id="chip"><span id="dot" hidden></span><b id="title">AR Viewer</b><small id="sheet"></small><small id="app-version" aria-label="Версия приложения">Загрузка…</small></div><button id="new-sheet" class="icon" aria-label="Новый лист" title="Новый лист"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H4a1 1 0 0 0-1 1v4m13-5h4a1 1 0 0 1 1 1v4M3 16v4a1 1 0 0 0 1 1h4m8 0h4a1 1 0 0 0 1-1v-4M3 12h18"/></svg></button></header>
<div id="part-progress" role="list" aria-label="Части модели" hidden></div><div id="reticle" hidden aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div id="panel"><p id="status" role="status">Загрузка…</p>
<div id="xr-controls" hidden><label><input id="xr-size" type="range" min="5" max="100" value="35" aria-label="Размер просмотра в сантиметрах"><output id="xr-size-label">35 см</output></label><button id="xr-reset">Разместить заново</button></div>
<div class="actions"><button id="start" class="primary" disabled>Открыть камеру</button><a id="look" rel="ar" aria-label="Открыть AR" hidden><img src="./quicklook.svg" alt=""></a><button id="webxr-open" class="primary" hidden>Открыть AR</button>
<div id="mode-switch" role="group" aria-label="Режим просмотра" hidden><button id="mode-ar" aria-pressed="false">AR</button><button id="mode-3d" aria-pressed="false">3D</button></div>
<div id="share-wrap" hidden><button id="share" class="icon" aria-label="Сохранить модель" title="Сохранить модель" aria-expanded="false" aria-controls="share-menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3m-4 4 4-4 4 4M7 10H5v11h14V10h-2"/></svg></button><div id="share-menu" hidden><button id="share-usdz">USDZ</button><button id="share-glb">GLB</button></div></div></div>
<small id="offline" role="status">Офлайн-ресурсы…</small><details id="diagnostics" hidden><summary>Диагностика</summary><p id="scene-info"></p><pre id="camera-info"></pre><pre id="tracking-info"></pre><button id="report">Сохранить отчёт</button><button id="marker-view" hidden>Hiro</button><p>Журнал не содержит кадров или геометрии. Запрос AR не подтверждает физическую приёмку.</p></details></div></div></body></html>
